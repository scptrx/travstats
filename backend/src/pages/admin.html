<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8" />
    <title>Admin Panel</title>

    <style>
        :root {
            --primary-color: #d88328;
            --primary-dark: #b86d1f;
            --secondary-color: #f0f0f0;
            --glass-bg: rgba(255, 255, 255, 0.95);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            --glass-shadow-hover: 0 12px 48px rgba(0, 0, 0, 0.15);
            --font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            --font-size: 16px;
            --border-radius: 16px;
            --padding: 12px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-family);
            padding: 2rem;
            background: #eee;
        }

        h1 {
            margin-bottom: 1.5rem;
        }

        .table-wrapper {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            padding: 1.5rem;
            border-radius: 24px;
            box-shadow: var(--glass-shadow);
            overflow-x: auto;
            width: 100%;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        th,
        td {
            padding: 0.75rem;
            text-align: left;
            vertical-align: middle;
        }

        th {
            font-weight: 700;
            border-bottom: 2px solid #ddd;
        }

        tr:not(:last-child) td {
            border-bottom: 1px solid #eee;
        }

        img.avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            background: #ccc;
        }

        input[type="text"],
        select,
        input[type="date"] {
            padding: 0.4rem 0.6rem;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-family: var(--font-family);
        }

        button {
            padding: 0.4rem 0.8rem;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: var(--transition);
            font-weight: 600;
        }

        button:hover {
            background: var(--primary-dark);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .save-cell {
            white-space: nowrap;
        }

        .muted {
            color: #777;
            font-size: 0.85rem;
        }

        .error {
            background: #ffebee;
            color: #c62828;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
        }
    </style>
</head>

<body>

    <h1>Admin Panel</h1>

    <div id="errorContainer"></div>

    <div class="table-wrapper">
        <table id="profilesTable">
            <thead>
                <tr>
                    <th>Avatar</th>
                    <th>Username</th>
                    <th>Email</th>
                    <th>Created</th>
                    <th>Role</th>
                    <th>Restricted until</th>
                    <th>Save</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td colspan="7" style="text-align: center;">Loading...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        const API_URL = "http://localhost:3000";

        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(';').shift();
        }

        function getToken() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('token') || getCookie('auth_token');
        }

        function showError(message) {
            const container = document.getElementById('errorContainer');
            container.innerHTML = `<div class="error">${message}</div>`;
            setTimeout(() => {
                container.innerHTML = '';
            }, 5000);
        }

        async function loadProfiles() {
            try {
                const token = getToken();
                const res = await fetch(`${API_URL}/admin/profiles`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!res.ok) {
                    throw new Error('Failed to load profiles');
                }

                const profiles = await res.json();
                renderTable(profiles);
            } catch (error) {
                console.error('Error loading profiles:', error);
                showError('Failed to load profiles. Please try again.');
                document.querySelector('#profilesTable tbody').innerHTML =
                    '<tr><td colspan="7" style="text-align: center; color: #c62828;">Error loading data</td></tr>';
            }
        }

        function renderTable(profiles) {
            const tbody = document.querySelector("#profilesTable tbody");
            tbody.innerHTML = "";

            if (profiles.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align: center;">No users found</td></tr>';
                return;
            }

            profiles.forEach(profile => {
                const tr = document.createElement("tr");

                tr.innerHTML = `
                    <td>
                        <img class="avatar" 
                             src="${profile.profile_picture_url || ''}" 
                             onerror="this.style.display='none'" />
                    </td>

                    <td>
                        <input type="text" 
                               value="${profile.username}" 
                               data-original="${profile.username}" />
                    </td>

                    <td class="muted">${profile.email}</td>

                    <td class="muted">
                        ${new Date(profile.created_at).toLocaleDateString()}
                    </td>

                    <td>
                        <select data-original="${profile.role}">
                            <option value="user" ${profile.role === "user" ? "selected" : ""}>user</option>
                            <option value="admin" ${profile.role === "admin" ? "selected" : ""}>admin</option>
                        </select>
                    </td>

                    <td>
                        <input type="date" 
                               value="${profile.restricted_until ? profile.restricted_until.split("T")[0] : ""}" 
                               data-original="${profile.restricted_until ? profile.restricted_until.split("T")[0] : ""}"
                               min="${new Date().toISOString().split('T')[0]}" />
                    </td>

                    <td class="save-cell">
                        <button onclick="saveProfile('${profile.id}', this.closest('tr'))">Save</button>
                    </td>
                `;

                tbody.appendChild(tr);
            });
        }

        async function saveProfile(id, row) {
            const usernameInput = row.querySelector('input[type="text"]');
            const roleSelect = row.querySelector('select');
            const restrictedInput = row.querySelector('input[type="date"]');
            const saveBtn = row.querySelector('button');

            const username = usernameInput.value.trim();
            const role = roleSelect.value;
            const restricted_until = restrictedInput.value || null;

            const hasChanges =
                username !== usernameInput.dataset.original ||
                role !== roleSelect.dataset.original ||
                (restricted_until || '') !== (restrictedInput.dataset.original || '');

            if (!hasChanges) {
                alert('No changes to save');
                return;
            }

            if (!username) {
                showError('Username cannot be empty');
                return;
            }

            saveBtn.disabled = true;
            saveBtn.textContent = 'Saving...';

            try {
                const token = getToken();
                const res = await fetch(`${API_URL}/admin/profiles/${id}`, {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${token}`
                    },
                    body: JSON.stringify({ username, role, restricted_until })
                });

                if (!res.ok) {
                    const error = await res.json();
                    throw new Error(error.error || 'Failed to save');
                }

                usernameInput.dataset.original = username;
                roleSelect.dataset.original = role;
                restrictedInput.dataset.original = restricted_until || '';

                alert("Saved successfully!");

                await loadProfiles();
            } catch (error) {
                console.error('Error saving profile:', error);
                showError(error.message || 'Failed to save changes');
                saveBtn.textContent = 'Save';
            } finally {
                saveBtn.disabled = false;
            }
        }

        loadProfiles();
    </script>

</body>

</html>
