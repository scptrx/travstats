<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Travel Dashboard - Travstats</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="/frontend/style/base.css">
    <link rel="stylesheet" href="/frontend/style/profile.css">
    <link rel="stylesheet" href="/frontend/style/gui.css">

    <link rel="icon" type="image/png" href="/frontend/assets/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/frontend/assets/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/frontend/assets/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/frontend/assets/favicon/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="travstats" />
    <link rel="manifest" href="/frontend/assets/favicon/site.webmanifest" />
</head>

<body>
    <div class="profile-container">
        <a href="/frontend/index.html" class="logo">
            <h1>Travstats</h1>
        </a>
        <h3>User Profile</h3>
        <div class="profile-info">
            <div class="loader">
                <p><strong>Loading...</strong></p>
            </div>
        </div>
    </div>

    <div class="dashboard-container">
        <h3>Travel Dashboard</h3>
        <div class="stat-row">
            <span class="stat-label">Traveled Countries:</span>
            <span class="stat-value" id="countries-count">0</span>
        </div>

        <div class="stat-row">
            <span class="stat-label">Traveled Cities:</span>
            <span class="stat-value" id="cities-count">0</span>
        </div>

        <div class="stat-row">
            <span class="stat-label">Northernmost City:</span>
            <span class="stat-value" id="northernmost-city">-</span>
        </div>

        <div class="stat-row">
            <span class="stat-label">Southernmost City:</span>
            <span class="stat-value" id="southernmost-city">-</span>
        </div>

        <div class="stat-row">
            <span class="stat-label">Easternmost City:</span>
            <span class="stat-value" id="easternmost-city">-</span>
        </div>

        <div class="stat-row">
            <span class="stat-label">Westernmost City:</span>
            <span class="stat-value" id="westernmost-city">-</span>
        </div>

    </div>
</body>
<script type="module" src="/frontend/script/profile/profile.js"></script>

</html>
