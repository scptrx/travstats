<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Sign Up - Travstats</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="/frontend/style/base.css">
    <link rel="stylesheet" href="/frontend/style/gui.css">

    <link rel="icon" type="image/png" href="/frontend/assets/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/frontend/assets/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/frontend/assets/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/frontend/assets/favicon/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="travstats" />
    <link rel="manifest" href="/frontend/assets/favicon/site.webmanifest" />
</head>

<body>
    <h1>Create an account</h1>
    <p>Sign up to start tracking your travel statistics</p>
    <form id="signup-form">
        <div>
            <label for="username">Username</label>
            <input id="username" name="username" type="text" autocomplete="username" required
                placeholder="your_username" />
        </div>

        <div>
            <label for="email">Email address</label>
            <input id="email" name="email" type="email" autocomplete="email" required placeholder="you@example.com" />
        </div>

        <div>
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="new-password" required minlength="8"
                placeholder="At least 8 characters" />
        </div>

        <div>
            <button id="submit" type="submit">Create account</button>
            <div>Already have an account? <a href="sign-in.html">Sign in</a></div>
        </div>
    </form>
</body>
<script type="module" src="/frontend/script/auth/signUp.js"></script>

</html>
